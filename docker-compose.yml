# =============================================================================
# AI Insight · 一键编排（Phase 0）
# 见 doc/design-doc/09-基础设施与部署.md §9.1。
#
# 服务：mysql / redis / server / user(nginx) / admin(nginx)
# 用法：
#   1. 复制 .env.example → .env，填 JWT_SECRET 等（见 14-留白与后续确认.md）
#   2. docker compose up -d --build
#   3. docker compose exec server pnpm db:push   # 建表
#   4. 访问 http://localhost:8080（用户端）/ http://localhost:8081（管理端）
# =============================================================================
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_insight
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-aiinsight}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-aiinsight}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_PASSWORD:-aiinsight}@mysql:3306/ai_insight
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://internal-llm/v1}
      LLM_API_KEY: ${LLM_API_KEY:-internal}
      LLM_MODEL: ${LLM_MODEL:-internal-model-name}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      PORT: "3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  user:
    build:
      context: .
      dockerfile: apps/user/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  mysql-data:
  redis-data:
